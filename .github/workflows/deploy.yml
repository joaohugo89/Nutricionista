# =============================================================================
# Publica o site no GitHub Pages a cada push na branch principal.
# O Pages é ligado automaticamente pelo passo configure-pages (enablement).
# =============================================================================
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Garante um deploy por vez, sem cancelar o que já está publicando
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A base do site ("/nome-do-repositorio/") é resolvida no vite.config.ts
      - run: npm run build

      # enablement: liga o GitHub Pages automaticamente na primeira execução,
      # sem precisar mexer em Settings → Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
